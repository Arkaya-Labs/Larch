[package]
license.workspace = true
name = "larch-sys"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "larch_kernels"

# NVML is loaded at run time (a machine without the NVIDIA driver has none); libloading is already
# in Cargo.lock through bindgen.
[dependencies]
libloading = "0.8"

# The agent sandbox's AppContainer and Job Object; both are in Cargo.lock already (win32job through
# the facade's supervisor).
[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The kernel library: CMake, bindgen and, by backend, CUDA or HIP. A crate that wants only the OS
# glue (the task service's pipe) turns default features off and builds none of it.
[features]
default = ["kernels"]
kernels = ["dep:bindgen", "dep:cmake"]

[build-dependencies]
bindgen = { version = "0.72", optional = true }
cmake = { version = "0.1", optional = true }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
