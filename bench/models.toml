# The benchmark and test models, by alias. Names and hashes live only here: each machine keeps the files
# as <alias>.gguf in one model directory (scripts/baseline.py models fetches and verifies them), and
# code, commits and PR text use the alias. m1 to m4 are tools/llama-logits/model-dumps.sh's fixtures.
# sha256 is the Hugging Face LFS hash, checked against the downloaded bytes on 7 Oct 2026.
# use: primary = the benchmark pair on every machine; sm86 = the 3050's 3B + 8B single-stream row;
# small = CPU checks of the driver; tokenizer = the tokenizer merge gate; r4 = requirement-R4 coverage;
# parity = the small-model parity gate (m8 is m4's model at another quantization, with its tokenizer);
# decider = the separate small model the agent's score router asks for a tool choice.
# catalog = the models the installer offers to download (scripts/release-manifest.py signs them into the
# release manifest): each needs a pinned revision, the machine memory it is offered at (min_mem_gb) and
# its upstream license. min_mem_gb sits 1 GiB under the memory size it is meant for (7 for an 8 GB
# machine): setup compares it with the memory the system reports, which on Linux and Windows is a little
# under the installed size (an 8 GB laptop reports about 7.6 GiB).

[m1]
repo = "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"
file = "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
sha256 = "7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"
