name: Model request
description: Ask for a model architecture or quantization Larch doesn't load yet.
labels: [model]
body:
  - type: input
    id: model
    attributes:
      label: Model
      description: A link to the model or its GGUF on Hugging Face.
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture and quantization
      description: The error Larch printed names the architecture. Include the quant, e.g. Q4_K_M.
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Your GPU and its memory
  - type: textarea
    id: why
    attributes:
      label: What you'd use it for
