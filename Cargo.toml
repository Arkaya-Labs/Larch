[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "Apache-2.0"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
# `--cfg loom` builds larch-records' ring on loom's atomics for the model-checking test.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Cargo's release default strips debuginfo from build dependencies too; on macOS that leaves proc-macro dylibs
# with a misaligned LINKEDIT string pool that rustc cannot load (E0463, #68). Binaries are still stripped.
[profile.release.build-override]
strip = false

# A chat title's grammar (larch-app's NAME_PATTERN) builds its DFA in about 0.5 s optimized and
# 5.6 s unoptimized, past the 5 s an unload waits for a naming job. Debug builds, and so the
# tests, optimize the DFA builder.
[profile.dev.package.regex-automata]
opt-level = 3
