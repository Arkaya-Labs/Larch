# cargo-deny policy for both Cargo workspaces (the root one and apps/desktop's). The `deny` CI job runs
# this in each workspace's folder; cargo-deny finds this file from apps/desktop by looking up the tree:
#   cargo deny --locked check
#   cd apps/desktop && cargo deny --locked check

[graph]
all-features = true

# Known vulnerabilities and unmaintained crates from the RustSec advisory database.
[advisories]
version = 2
yanked = "deny"
# Each entry names the advisory, why it cannot be fixed by a compatible update, and when to remove it.
ignore = [
    # lopdf: stack overflow on deeply nested PDF objects, which aborts the process. It is reachable: a
    # fetched web PDF goes to pdf-extract in the agent's process when poppler's pdftotext is missing
    # (most Macs). pdf-extract 0.10 pins lopdf 0.38; remove when larch-agent moves to a pdf-extract
    # release whose lopdf has the fix, which is the first dependency upgrade to make.
    { id = "RUSTSEC-2026-0187", reason = "pinned by pdf-extract 0.10; needs a pdf-extract upgrade" },
    # SQLite before 3.54.0 (bundled by libsqlite3-sys): stale memory from a crafted database and -wal
    # pair. rusqlite 0.40 pins libsqlite3-sys 0.38; remove with the rusqlite upgrade.
    { id = "RUSTSEC-2026-0459", reason = "pinned by rusqlite 0.40; needs a rusqlite upgrade" },
    # chrono and chrono-tz are marked unmaintained, with no maintained replacement for time-zone
    # arithmetic yet; revisit when one exists or an advisory names a defect.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no replacement yet" },
    { id = "RUSTSEC-2026-0555", reason = "unmaintained, no replacement yet" },
]

# Licenses a dependency may be used under in this Apache-2.0 project. A crate offered under several
# licenses passes when one of them is listed.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: the crates stay unmodified and their source is on crates.io.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions come from upstream crates' own pins; they are a size question, not a policy one.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

# Dependencies come from crates.io, or from a git repository listed here.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
