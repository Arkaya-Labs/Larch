[package]
license = "Apache-2.0"
name = "larch-installer"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Its own workspace, as the desktop app's: the root one (crates/*) builds and tests on Linux CI
# without a window system.
[workspace]

# As in the root workspace (#68): a stripped proc-macro dylib does not load on macOS.
[profile.release.build-override]
strip = false

# The desktop app's stand-in for gpui's xattr, for the same reason (apps/desktop/Cargo.toml).
[patch.crates-io]
xattr = { path = "../desktop/patches/xattr" }

[dependencies]
# The same versions as the desktop app's lock, so the window looks and behaves as the app does.
futures = "0.3"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
larch-setup = { path = "../../crates/larch-setup" }

[target.'cfg(windows)'.dependencies]
larch-fetch = { path = "../../crates/larch-fetch" }

[build-dependencies]
embed-resource = "3"
